# vim:fileencoding=utf-8:foldmethod=marker

font_family      JetBrains Mono
font_size 12.0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 25.0
enable_audio_bell no
allow_remote_control yes
listen_on unix:/tmp/mykitty
clipboard_control write-clipboard write-primary read-clipboard read-primary
linux_display_server auto
# Disable CSD titlebars to prevent Wayland OpenGL viewport corruption
hide_window_decorations yes

enabled_layouts tall:bias=65,grid,stack

# panes
map ctrl+a>s launch --cwd=current
map ctrl+a>g toggle_layout grid
map ctrl+a>z toggle_layout stack

# windows (tabs)
map ctrl+a>c new_tab_with_cwd
map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3

# pane navigation like neovim
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# Pass keys to Neovim when Neovim is active
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

paste_actions replace-dangerous-control-codes

# Position tab bar at top
tab_bar_edge top

# Minimalist separator design
tab_bar_style separator
tab_separator " │ "
tab_title_template " {index}: {title} "

# Tab bar position & style
tab_bar_edge top
tab_bar_style separator
tab_separator " │ "
tab_title_template " {index}: {title} "

include current-theme.conf

# Kanagawa Dragon Tab Palette
active_tab_foreground   #E6C384
active_tab_background   #282727
inactive_tab_foreground #717C7C
inactive_tab_background #181616
tab_bar_background      #181616

# Window border styling
window_border_width 1.5pt
draw_minimal_borders no

# Kanagawa Dragon active/inactive border palette
active_border_color   #E6C384
inactive_border_color #2A2A37
bell_border_color     #E82424

# tweak settings for each host
include ${HOSTNAME}.conf
